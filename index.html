<html>
<head>

<style>

body
{
	background-color: #000;
	color:#ccc
}

.table{
	display: grid;
	grid-template-rows: repeat(10,1fr);
	
	.row{
		display: grid;
	  grid-template-columns: repeat(10,1fr);
	
	}
	.cell{
		border:0px solid #777;
		padding: 0px;
		padding-bottom: 2px;
		padding-right: 1px;
	}

	input
	{
		display: block;
		background-color:#222;
		color:#fff;
		width:calc(100% - 1px);
		height: 100%;
		outline: 1px solid #666;
		margin-bottom: 1px;
		border: none;

		&:focus{
			outline: 1px solid #00cccc;
		}
	}

}

</style>
</head>
<body>
<script>

const width=10
const height=10
const data=[]
data.length=height*width;

const elTable=document.createElement("div")
elTable.classList.add("table")
for(let x=0;x<width;x++)
{
	const elRow=document.createElement("div")
	elRow.classList.add("row");
	elTable.appendChild(elRow);

	for(let y=0;y<height;y++)
	{
		const elCell=document.createElement("div")
		elCell.classList.add("cell")
		elRow.appendChild(elCell)
		const elInput=document.createElement("input")
		elInput.dataset.x=x;
		elInput.dataset.y=y;
		elCell.appendChild(elInput)

		elInput.addEventListener("input",(e)=>{
			console.log("nnnn",e.srcElement)
			
			const idx=parseInt(e.srcElement.dataset.x)+width* parseInt(e.srcElement.dataset.y)
			data[idx]=e.srcElement.value;
			console.log(data)
			
		});
	}
}
document.body.appendChild(elTable)

</script>
</body>
</html>
