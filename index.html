<html>
<head>

<style>

body
{
	background-color: #000;
	color:#ccc
}

.cellmateStatus
{
	font-family: monospace;
	background-color: #151515;
	padding: 5px;
		outline: 1px solid #555;
}

.table
{
	--color-grid:#444;

	font-family: monospace;
	display: grid;
	grid-template-rows: repeat(11,1fr);
	
	.row{
		display: grid;
		grid-template-columns: repeat(11,1fr);
	}

	.head{
		display: inline-block;
		background-color: #151515;
		text-align: center;
		outline: 1px solid var(--color-grid);

		&.selected{
			outline: 1px solid var(--color-grid);
			background-color: #282800;
			color:#ffff00;
		}
	}

	.cell,.head{
		border:0px solid #aaa;
		padding: 0px;
		padding-bottom: 2px;
		padding-right: 1px;
		height: 20px;
	}

	.cursor{
		border:1px solid #ffff00;
	}

	.selected{
		background-color: #555526;
		outline: 1px solid #888800;
		color:#ffff00;
	}

	input
	{
		display: block;
		background-color:#222;
		color:#ccc;
		width:calc(100% - 1px);
		height: 100%;
		outline: 1px solid var(--color-grid);
		margin-bottom: 1px;
		border: none;
		font-family: monospace;

		&:focus{
			outline: 1px solid #00cccc;
		}
	}

	&:focus{
		outline: 1px solid #444;
	}

}

</style>
</head>
<body>
<script>

class CellMate
{
	#width=10;
	#height=30;
	#data=[];
	#dataWidth=5;
	#dataHeight=100;

	#cursorX=0;
	#cursorY=0;

	#elTable=null;
	#elActiveInput=null;

	#selectionStartX=-1
	#selectionStartY=-1
	#selectionEndX=-1
	#selectionEndY=-1
	#colTitles=[];
	#scrollY=0;
	#scrollX=0;

	constructor()
	{
		this.#data.length=this.#dataWidth*this.#dataHeight;
		for(let i=0;i<this.#dataWidth*this.#dataHeight;i++)
			this.#data[i]=Math.random();

		this.html();
		this.setCursor(this.#cursorX,this.#cursorY);
	}

cellId(x,y)
{
	return "cell"+x+"_"+y;	
}

clampCursor()
{
	this.#cursorX=Math.max(0,this.#cursorX)
	this.#cursorY=Math.max(0,this.#cursorY)

	this.#cursorX=Math.min(this.#width-1,this.#cursorX)
	this.#cursorY=Math.min(this.#height-1,this.#cursorY)
}

focusCell(x,y)
{
	this.setCursor(x,y);
	this.getCursorEl()?.removeAttribute("readonly")

	this.#elActiveInput=this.getCursorEl()

	this.getCursorEl()?.focus();
	this.getCursorEl()?.select();
}

unFocusInput()
{
	if(!this.#elActiveInput)return;
	this.#elActiveInput.blur();
	this.getCursorEl().setAttribute("readonly",true)
	this.#elActiveInput=null;
}

setCursor(x,y,e)
{
	if(e&&!e.shiftKey&&this.#selectionEndX!=-1)this.unselectAll();
	if(e&&e.shiftKey&&this.#selectionStartX==-1)this.startSelection(this.#cursorX,this.#cursorY);
	else{
		document.getElementsByClassName("rowHead"+this.#cursorY)[0]?.classList.remove("selected");
		document.getElementsByClassName("colHead"+this.#cursorX)[0]?.classList.remove("selected");
	}
	let cursorEl=this.getCursorEl();
	if(cursorEl)
	{
		cursorEl.classList.remove("cursor");
		if(this.#elActiveInput) this.unFocusInput();
	}

	this.#cursorX=x;
	this.#cursorY=y;
	this.clampCursor();

	cursorEl=this.getCursorEl()
	if(cursorEl)
	{
		cursorEl.classList.add("cursor");
		cursorEl.setAttribute("readonly",true)
	}
	this.#elTable.focus()
	if(e&&e.shiftKey)this.setEndSelection(this.#cursorX,this.#cursorY);
	else
	{
		document.getElementsByClassName("rowHead"+this.#cursorY)[0]?.classList.add("selected");
		document.getElementsByClassName("colHead"+this.#cursorX)[0]?.classList.add("selected");
	}
	this.updateStatus();
}

startSelection(x,y)
{
	this.#selectionStartX=x
	this.#selectionStartY=y
}

setEndSelection(x,y)
{
	this.#selectionEndX=x
	this.#selectionEndY=y
	this.updateSelection();
}

unselectAll()
{
	let eles=this.#elTable.getElementsByClassName("selected")
	while(eles.length)
	{
		for(let i=0;i<eles.length;i++)eles[i].classList.remove("selected")
		eles=this.#elTable.getElementsByClassName("selected")
	}

	this.#selectionStartX=this.#selectionStartY=this.#selectionEndX=this.#selectionEndY=-1;
}
getValue(x,y)
{
	let v=this.#data[x+y*this.#dataWidth];
	if(v==undefined)v="";
	return v;
}

forEachSelected(cb)
{
	const sx=Math.min(this.#selectionStartX,this.#selectionEndX)
	const sy=Math.min(this.#selectionStartY,this.#selectionEndY)
	const ex=Math.max(this.#selectionStartX,this.#selectionEndX)
	const ey=Math.max(this.#selectionStartY,this.#selectionEndY)

	let count=0;
	if(sx!=1&&sy!=1&&ex!=1&&ey!=-1)
		for(let y=sy;y<=ey;y++)
			for(let x=sx;x<=ex;x++)
			{
				count++;
				cb(x,y,this.getValue(x,y));
			}

	if(count==0)cb(this.#cursorX,this.#cursorY,this.getValue(this.#cursorX,this.#cursorY))
}

deleteSelectionContent(c)
{
	this.forEachSelected((x,y,v)=>{
		const elCell=	document.getElementById(this.cellId(x,y))
		if(elCell) elCell.value=""
	})
}

updateSelection()
{
	let eles=Array.from(this.#elTable.getElementsByClassName("selected"));
	for(let i=0;i<eles.length;i++)eles[i].classList.remove("selected")

	const sx=Math.min(this.#selectionStartX,this.#selectionEndX)
	const sy=Math.min(this.#selectionStartY,this.#selectionEndY)
	const ex=Math.max(this.#selectionStartX,this.#selectionEndX)
	const ey=Math.max(this.#selectionStartY,this.#selectionEndY)

	for(let y=sy;y<=ey;y++)
	{
		const eleRowHead=document.getElementsByClassName("rowHead"+y)
		if(eleRowHead[0])eleRowHead[0].classList.add("selected")

		for(let x=sx;x<=ex;x++)
		{
			if(y==sy)
			{
				const eleColHead=document.getElementsByClassName("colHead"+x)
				if(eleColHead[0])eleColHead[0].classList.add("selected")
			}

			const ele=document.getElementById(this.cellId(x,y))
			ele?.classList.add("selected")
		}
	}
}

getCursorEl( )
{
	return document.getElementById(this.cellId(this.#cursorX,this.#cursorY));
}

moveCursorUp(e)
{
	if(this.#cursorY<1&&this.#scrollY)return this.scrollUp();
	this.setCursor(this.#cursorX,this.#cursorY-1,e);
}

moveCursorDown(e)
{
	if(this.#cursorY>=this.#height-1)return this.scrollDown();
	this.setCursor(this.#cursorX,this.#cursorY+1,e);
}

moveCursorLeft(e)
{
	if(this.#cursorX<1&&this.#scrollX)return this.scrollLeft();
	this.setCursor(this.#cursorX-1,this.#cursorY,e);
}

moveCursorRight(e)
{
	if(this.#cursorX>=this.#width-1)return this.scrollRight();
	this.setCursor(this.#cursorX+1,this.#cursorY,e);
}

scrollDown()
{
	this.#scrollY++;
	this.redrawData();
}
scrollRight()
{
	this.#scrollX++;
	this.redrawData();
}
scrollLeft()
{
	this.#scrollX--;
	this.redrawData();
}

scrollUp()
{
	this.#scrollY--;
	if(this.#scrollY<0)this.#scrollY=0;
	this.redrawData();
}

moveY(num)
{
	for(let i=0;i<Math.abs(num);i++)
	{
		if(num>0)this.moveCursorDown()
		else this.moveCursorUp()
	}
}

setValue(x,y,v)
{
	const idx=x+this.#width* y;
	while(idx>this.#data.length)
	{
		for(let i=0;i<this.#width;i++) this.#data.push("");
	}
	this.#data[idx]=v;
	const inputEle=document.getElementById(this.cellId(x,y))
	if(inputEle)inputEle.value=v;
}

fromTxt(txt,x,y)
{
	const separator="\t";
	const rows=txt.split("\n");

	for(let i=0;i<rows.length;i++)
	{
		const cols=rows[i].split(separator);

		for(let j=0;j<cols.length;j++)
			this.setValue(this.#cursorX+j,this.#cursorY+i,cols[j])
	}
}

toTxt()
{
	const separator="\t";
	let str="";
	let yy=-1;
	this.forEachSelected((x,y,v)=>
	{
		if(yy!=-1&&y>yy) str+="\n";

		str=str+v+separator;
		yy=y;
	});

	return str+"\n";
}

redrawData()
{
	for(let x=0;x<this.#width;x++)
	{
		const head=document.getElementsByClassName("colHead"+x)[0];
		let s=String(x+this.#scrollX);
		if(this.#colTitles[x+this.#scrollX]) s+=":" +this.#colTitles[x+this.#scrollX];
		head.innerHTML=s;
	}

	for(let y=0;y<this.#height;y++)
	{

		const eleRowHead=document.getElementsByClassName("rowHead"+y)[0];
		eleRowHead.innerHTML=y+this.#scrollY;

		for(let x=0;x<this.#width;x++)
		{
			const elCell=document.getElementById(this.cellId(x,y));
			if(x+this.#scrollX<this.#dataWidth&& y+this.#scrollY<this.#dataHeight)
				elCell.value=this.#data[(x+this.#scrollX)+(y+this.#scrollY)*this.#dataWidth];
			else elCell.value="";
		}

	}
	this.updateStatus();

}
updateStatus()
{
	this.elStatus.innerHTML=(this.#cursorX+this.#scrollX )+","+(this.#cursorY+this.#scrollY);
}

html()
{
	const elTable=document.createElement("div")
	elTable.classList.add("table")
	elTable.setAttribute("tabindex",1);

	const elRow=document.createElement("div")
	elRow.classList.add("row");
	elTable.appendChild(elRow);
	for(let x=0;x<this.#width+1;x++)
	{
		const elColHead=document.createElement("div")
		elColHead.classList.add("head");
		if(x>0)elColHead.classList.add("colHead"+(x-1));
		elColHead.dataset.idx=x;
		elRow.appendChild(elColHead);
		if(x) elColHead.innerHTML=x;
		elColHead.addEventListener("click",(e)=>{
			const t=prompt("title");
			this.#colTitles[parseInt(e.srcElement.dataset.x)];
			e.srcElement.innerHTML=t;		
		});
	}

	for(let y=0;y<this.#height;y++)
	{
		const elRow=document.createElement("div")
		elRow.classList.add("row");
		elTable.appendChild(elRow);

		const elRowHead=document.createElement("div")
		elRowHead.classList.add("head")
		elRowHead.classList.add("rowHead"+y)
		elRow.appendChild(elRowHead)
		elRowHead.innerHTML=y;

		for(let x=0;x<this.#width;x++)
		{
			const elCell=document.createElement("div")
			elCell.classList.add("cell")
			elRow.appendChild(elCell)
			const elInput=document.createElement("input");
			elInput.id=this.cellId(x,y)
			elInput.setAttribute("readonly",true)
			elInput.dataset.x=x;
			elInput.dataset.y=y;
			elCell.appendChild(elInput);

			elInput.addEventListener("pointerdown",(e)=>
			{
				this.mouseDown=true;
				this.#selectionStartX= parseInt(e.srcElement.dataset.x);
				this.#selectionStartY= parseInt(e.srcElement.dataset.y);
				this.setCursor(this.#selectionStartX,this.#selectionStartY)
			});

			elInput.addEventListener("pointerup",(e)=>
			{
				this.mouseDown=false;
			});

			elInput.addEventListener("pointerenter",(e)=>
			{
				if(this.mouseDown&&this.#selectionStartX!=-1)
				{
					this.#selectionEndX= parseInt(e.srcElement.dataset.x);
					this.#selectionEndY= parseInt(e.srcElement.dataset.y);
					this.updateSelection()
				}
			});

			elInput.addEventListener("input",(e)=>
			{
				const idx=parseInt(e.srcElement.dataset.x)+this.#dataWidth* parseInt(e.srcElement.dataset.y)
				this.#data[idx]=e.srcElement.value;
			});

			elCell.addEventListener("click",(e)=>
			{
				this.setCursor(parseInt(e.srcElement.dataset.x), parseInt(e.srcElement.dataset.y),e)
			});

			elInput.addEventListener("dblclick",(e)=>
			{
				this.focusCell(parseInt(e.srcElement.dataset.x), parseInt(e.srcElement.dataset.y),e);
			});

			elInput.addEventListener("keydown",(e)=>
			{
	
			});
		}
	}

	this.#elTable=elTable;
	document.body.appendChild(elTable)

	this.elStatus=document.createElement("div")
	this.elStatus.classList.add("cellmateStatus");
	document.body.appendChild(this.elStatus);

	this.#elTable.addEventListener("copy",(e)=>
	{
		navigator.clipboard.writeText(this.toTxt());
	});

	this.#elTable.addEventListener("paste",(e)=>
	{
        this.isPasting = true;
        if (e.clipboardData.types.indexOf("text/plain") == -1)
        {
            console.log("Paste failed",e.clipboardData.types);
            return;
        }
        let str = e.clipboardData.getData("text/plain");
		console.log(str);
		this.fromTxt(str);
		e.preventDefault();
	});

	this.#elTable.addEventListener("keydown",(e)=>
	{
		if(e.key=="Enter")
		{
			if(this.#elActiveInput)
			{
				this.unFocusInput();
				this.moveCursorDown()
			}
			else
			{
				this.unFocusInput();
				this.focusCell(this.#cursorX,this.#cursorY);
			}
		}
		else if(!this.#elActiveInput && (e.key=="Delete"||e.key=="Backspace")) this.deleteSelectionContent();
		else if(!this.#elActiveInput &&  e.key=="ArrowDown") this.moveCursorDown(e);
		else if(!this.#elActiveInput &&  e.key=="ArrowUp") this.moveCursorUp(e);
		else if(!this.#elActiveInput &&  e.key=="ArrowLeft") this.moveCursorLeft(e);
		else if(!this.#elActiveInput &&  e.key=="ArrowRight") this.moveCursorRight(e);
		else if(!this.#elActiveInput &&  e.key=="PageUp") this.moveY(-this.#height/2);
		else if(!this.#elActiveInput &&  e.key=="PageDown") this.moveY(this.#height/2);
		else
			if(e.code && (e.code.startsWith("Digit") || e.code.startsWith("Key") ))
			{
				if(!this.#elActiveInput) this.focusCell(this.#cursorX,this.#cursorY);
			}
			else console.log(e)

	});
	this.redrawData();
}
	
}



new CellMate()

</script>
</body>
</html>
